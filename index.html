<!DOCTYPE html>
<html>
<head>
  <title>Maple Yahtzee!</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play Yahtzee!">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="/extras/yahtzee-cup.png" sizes="180x180">
  <link rel="apple-touch-icon" href="/extras/yahtzee-cup.png">
  <script src="https://cdn.jsdelivr.net/npm/pyodide@314.0.3/pyodide.min.js"></script>
  <style>
    body, button, select {
      font-family: MS Sans Serif, sans-serif;
      font-size: 11px;
    }
    button, label.hold {
      border: 2px outset;
    }
    button:active:not(:disabled), input.hold:checked + .hold {
      border: 2px inset;
    }
    button:disabled {
      filter: contrast(0.5);
    }
    ol, ul {
      list-style-type: none;
      padding-left: 0;
    }
    fieldset {
      padding-block: 0;
    }
    .sel {
      width: 44px;
      height: 44px;
    }
    .die {
      width: 110px;
      height: 110px;
      border: 2px inset;
      object-fit: none;
    }
    .die:nth-child(odd) {
      background-color: whitesmoke;
    }
    .die:nth-child(even) {
      background-color: lightgray;
    }
    input.hold {
      appearance: none;
      position: absolute;
      inset: 0;
    }
    label.hold {
      padding: 8px;
      color: whitesmoke;
      background-color: firebrick;
      text-transform: uppercase;
      text-align: center;
      flex: 1;
    }
    input.hold:checked + .hold {
      background-color: salmon;
    }
    .action:active:not(:disabled), input.hold:active + .hold {
      background-color: crimson;
    }
    .action {
      color: sandybrown;
      background-color: firebrick;
      width: 128px;
      height: 36px;
    }
    .container {
      display: flex;
      position: relative;
    }
    #rollButton {
      color: whitesmoke;
    }
    #selectButton {
      background-color: yellow;
    }
    #selectButton:active:not(:disabled) {
      background-color: gold;
    }
    #onesButton {
      background-image: url("sel1.gif");
    }
    #twosButton {
      background-image: url("sel2.gif");
    }
    #threesButton {
      background-image: url("sel3.gif");
    }
    #foursButton {
      background-image: url("sel4.gif");
    }
    #fivesButton {
      background-image: url("sel5.gif");
    }
    #sixesButton {
      background-image: url("sel6.gif");
    }
    #threeOfAKindButton {
      background-image: url("sel7.gif");
    }
    #fourOfAKindButton {
      background-image: url("sel8.gif");
    }
    #fullHouseButton {
      background-image: url("sel9.gif");
    }
    #smallStraightButton {
      background-image: url("sel10.gif");
    }
    #largeStraightButton {
      background-image: url("sel11.gif");
    }
    #chanceButton {
      background-image: url("sel12.gif");
    }
    #yahtzeeButton {
      width: 84px;
      background-image: url("sel13.gif");
    }
    #yahtzeeButton:active {
      border-color: red;
    }
    #scoreLabel {
      text-transform: uppercase;
      font-size: 28px;
      text-align: center;
    }
    #rollButton {
      text-transform: uppercase;
    }
    #mainframe {
      border: 7px solid peachpuff;
      border-radius: 8px;
      transition: transform 0.5s cubic-bezier(0, 0, 0.2, 1);
    }
    #mainframe.loading {
      filter: contrast(0.5);
      animation: spin 2s ease infinite;
    }
    
    @keyframes spin {
      from {
        transform: rotate3d(1, 1, 1, 0deg);
      }
      to {
        transform: rotate3d(3, 8, 10, 360deg);
      }
    }
  </style>
</head>
<body bgcolor="black" style="background-image: url('extras/bliss.png'); background-size: cover; background-repeat: no-repeat; image-rendering: pixelated;">
  <div id="mainframe" style="background-color: beige; display: grid; grid-auto-rows: 1fr auto; width: 570px; margin: auto; image-rendering: auto;">
    <img src="yahtzee.gif">
    <div id="selectionFrame" style="grid-column: 2; background-color: whitesmoke; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr auto; place-items: center; border: 4px ridge; margin: auto; margin-right: 8px;">
      <button id="onesButton" class="sel"></button>
      <button id="twosButton" class="sel"></button>
      <button id="threesButton" class="sel"></button>
      <button id="foursButton" class="sel"></button>
      <button id="fivesButton" class="sel"></button>
      <button id="sixesButton" class="sel"></button>
      <span id="rollScore">Roll Value: 0</span>
      <button id="threeOfAKindButton" class="sel"></button>
      <button id="fourOfAKindButton" class="sel"></button>
      <button id="fullHouseButton" class="sel"></button>
      <button id="smallStraightButton" class="sel"></button>
      <button id="largeStraightButton" class="sel"></button>
      <button id="chanceButton" class="sel"></button>
      <button id="yahtzeeButton" class="sel"></button>
    </div>
    <button id="selectButton" style="grid-column: 3; height: 96px; margin: auto; margin-left: 0;">Select</button>
    
    <div id="diceFrame" style="grid-area: 2 / 1 / 3 / 4; background-color: peachpuff; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; margin: auto;">
      <img id="die1" class="die" src="cards.gif">
      <img id="die2" class="die" src="cards.gif">
      <img id="die3" class="die" src="cards.gif">
      <img id="die4" class="die" src="cards.gif">
      <img id="die5" class="die" src="cards.gif">
      
      <span class="container"><input type="checkbox" id="dieHold1" class="hold"></button><label for="dieHold1" class="hold">Hold</label></span>
      <span class="container"><input type="checkbox" id="dieHold2" class="hold"></button><label for="dieHold2" class="hold">Hold</label></span>
      <span class="container"><input type="checkbox" id="dieHold3" class="hold"></button><label for="dieHold3" class="hold">Hold</label></span>
      <span class="container"><input type="checkbox" id="dieHold4" class="hold"></button><label for="dieHold4" class="hold">Hold</label></span>
      <span class="container"><input type="checkbox" id="dieHold5" class="hold"></button><label for="dieHold5" class="hold">Hold</label></span>
      
      <div style="grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; place-items: center; margin-top: 8px; row-gap: 8px;">
        <fieldset>
          <legend>Values</legend>
          <ol>
            <li>Snail &ndash; 1</li>
            <li>Shroom &ndash; 2</li>
            <li>Pig &ndash; 3</li>
            <li>Root &ndash; 4</li>
            <li>Panda &ndash; 5</li>
            <li>Mano &ndash; 6</li>
          </ol>
        </fieldset>
        <span id="scoreLabel" style="grid-column: 2;">Score 0</span>
        <fieldset>
          <legend>Game Data</legend>
          <ul>
            <li id="rollCountLabel" style="margin-block: 8px;">Rolls Made: 0</li>
            <li id="subTotalLabel" style="margin-block: 8px;">Sub Total: 0</li>
            <li id="yahtzeeCountLabel" style="margin-block: 8px;">Yahtzees: 0</li>
          </ul>
        </fieldset>
        
        <button id="quitButton" class="action" style="justify-self: start;">Quit</button>
        <button id="rollButton" class="action">Roll</button>
        <button id="resetButton" class="action" style="justify-self: end;">Reset Game</button>
      </div>
    </div>
  </div>
  <script>
    function showLoading() {
      document.getElementById("mainframe").classList.add("loading");
    }
    function doneLoading() {
      const mf = document.getElementById("mainframe");
      requestAnimationFrame(() => {
        mf.style.transform = getComputedStyle(mf).transform;
        mf.classList.remove("loading");
        requestAnimationFrame(() => { mf.style.transform = "rotate3d(0, 0, 0, 0deg)"; });
      });
    }
    function prepareYahtzee() {
      const buttons = [
        "onesButton",
        "twosButton",
        "threesButton",
        "foursButton",
        "fivesButton",
        "sixesButton",
        "threeOfAKindButton",
        "fourOfAKindButton",
        "fullHouseButton",
        "smallStraightButton",
        "largeStraightButton",
        "chanceButton",
        "yahtzeeButton",
        "selectButton",
        "quitButton",
        "rollButton",
        "resetButton",
      ].map(id => document.getElementById(id));
      for (const b of buttons) {
        b.setState = state => {
          if (state === "normal") {
            b.disabled = false;
          } else if (state === "disabled") {
            b.disabled = true;
          } else {
            console.log(`${b.id}.setState called with invalid argument "${state}"`)
          }
        };
      }
      const images = [
        "die1",
        "die2",
        "die3",
        "die4",
        "die5",
      ].map(id => document.getElementById(id));
      for (const i of images) {
        i.setImage = image => i.src = image;
      }
      const labels = [
        "rollScore",
        "rollCountLabel",
        "subTotalLabel",
        "yahtzeeCountLabel",
        "scoreLabel",
      ].map(id => document.getElementById(id));
      for (const elem of labels) {
        elem.setText = text => elem.textContent = text;
      }
      const checkboxes = [
        "dieHold1",
        "dieHold2",
        "dieHold3",
        "dieHold4",
        "dieHold5",
      ].map(id => document.getElementById(id));
      for (const elem of checkboxes) {
        elem.deselect = () => elem.checked = false;
      }
      const yobject = {
        photoList: ["one.gif", "two.gif", "three.gif", "four.gif", "five.gif", "six.gif", "sel1.gif", "sel2.gif", "sel3.gif", "sel4.gif", "sel5.gif", "sel6.gif", "sel7.gif", "sel8.gif", "sel9.gif", "sel10.gif", "sel11.gif", "sel12.gif", "sel13.gif", "yahtzee.gif", "cards.gif"],
        onesButton: document.getElementById("onesButton"),
        twosButton: document.getElementById("twosButton"),
        threesButton: document.getElementById("threesButton"),
        foursButton: document.getElementById("foursButton"),
        fivesButton: document.getElementById("fivesButton"),
        sixesButton: document.getElementById("sixesButton"),
        threeOfAKindButton: document.getElementById("threeOfAKindButton"),
        fourOfAKindButton: document.getElementById("fourOfAKindButton"),
        fullHouseButton: document.getElementById("fullHouseButton"),
        smallStraightButton: document.getElementById("smallStraightButton"),
        largeStraightButton: document.getElementById("largeStraightButton"),
        chanceButton: document.getElementById("chanceButton"),
        yahtzeeButton: document.getElementById("yahtzeeButton"),
        selectButton: document.getElementById("selectButton"),
        quitButton: document.getElementById("quitButton"),
        rollButton: document.getElementById("rollButton"),
        resetButton: document.getElementById("resetButton"),
        die1: document.getElementById("die1"),
        die2: document.getElementById("die2"),
        die3: document.getElementById("die3"),
        die4: document.getElementById("die4"),
        die5: document.getElementById("die5"),
        rollScore: document.getElementById("rollScore"),
        rollCountLabel: document.getElementById("rollCountLabel"),
        subTotalLabel: document.getElementById("subTotalLabel"),
        yahtzeeCountLabel: document.getElementById("yahtzeeCountLabel"),
        scoreLabel: document.getElementById("scoreLabel"),
        dieHold1: document.getElementById("dieHold1"),
        dieHold2: document.getElementById("dieHold2"),
        dieHold3: document.getElementById("dieHold3"),
        dieHold4: document.getElementById("dieHold4"),
        dieHold5: document.getElementById("dieHold5"),
        gameOver: (text) => alert(text),
      };
      return yobject;
    }
    async function runYahtzee() {
      pyodide = await loadPyodide();
      await pyodide.runPython(await (await fetch("Yahtzee.py")).text());
      attachHandlers();
    }
    function attachHandlers() {
      document.getElementById("quitButton").addEventListener("click", () => {
        window.location = "/";
      });
      document.getElementById("rollButton").addEventListener("click", () => {
        pyodide.globals.get("roll")();
      });
      document.getElementById("resetButton").addEventListener("click", () => {
        pyodide.globals.get("resetGame")();
      });
      document.getElementById("selectButton").addEventListener("click", () => {
        pyodide.globals.get("select")();
      });
      
      [
        "onesButton",
        "twosButton",
        "threesButton",
        "foursButton",
        "fivesButton",
        "sixesButton",
        "threeOfAKindButton",
        "fourOfAKindButton",
        "fullHouseButton",
        "smallStraightButton",
        "largeStraightButton",
        "chanceButton",
        "yahtzeeButton",
      ].forEach(id => document.getElementById(id).addEventListener("click", () => {
        pyodide.globals.get(id.replace("Button", ""))();
      }));
    }
    var yobject = prepareYahtzee();
    var pyodide;
    showLoading();
    runYahtzee().then(doneLoading);
  </script>
</body>
</html>
