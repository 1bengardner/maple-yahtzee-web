<!DOCTYPE html>
<html>
<head>
  <title>Maple Yahtzee!</title>
  <meta charset="utf-8">
  <meta name="description" content="Play Yahtzee!">
  <meta property="og:image" content="https://bengardner.ca/games/yahtzee/extras/yahtzee-cup.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="extras/yahtzee-cup.png" sizes="180x180">
  <link rel="apple-touch-icon" href="extras/yahtzee-cup.png">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="modal.css">
  <script src="https://cdn.jsdelivr.net/npm/pyodide@314.0.3/pyodide.min.js"></script>
</head>
<body bgcolor="black" style="background-image: url('extras/bliss.png'); background-size: cover; background-repeat: no-repeat; image-rendering: pixelated;">
  <div style="position: relative;">
    <div id="mainframe" style="background-color: beige; display: grid; grid-auto-rows: 1fr auto; width: 570px; margin: auto; image-rendering: auto;">
      <img src="yahtzee.gif">
      <div id="selectionFrame" style="grid-column: 2; background-color: whitesmoke; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr auto; place-items: center; border: 4px ridge; margin: auto; margin-right: 8px;">
        <span class="container"><input type="radio" name="selection" id="sel1" class="hidden"></input><label for="sel1" id="onesButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel2" class="hidden"></input><label for="sel2" id="twosButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel3" class="hidden"></input><label for="sel3" id="threesButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel4" class="hidden"></input><label for="sel4" id="foursButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel5" class="hidden"></input><label for="sel5" id="fivesButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel6" class="hidden"></input><label for="sel6" id="sixesButton" class="sel"></label></span>
        <span id="rollScore">Roll Value: 0</span>
        <span class="container"><input type="radio" name="selection" id="sel7" class="hidden"></input><label for="sel7" id="threeOfAKindButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel8" class="hidden"></input><label for="sel8" id="fourOfAKindButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel9" class="hidden"></input><label for="sel9" id="fullHouseButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel10" class="hidden"></input><label for="sel10" id="smallStraightButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel11" class="hidden"></input><label for="sel11" id="largeStraightButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel12" class="hidden"></input><label for="sel12" id="chanceButton" class="sel"></label></span>
        <span class="container"><input type="radio" name="selection" id="sel13" class="hidden"></input><label for="sel13" id="yahtzeeButton" class="sel"></label></span>
      </div>
      <button id="selectButton" style="grid-column: 3; height: 96px; margin: auto; margin-left: 0;">Select</button>
      
      <div id="diceFrame" style="grid-area: 2 / 1 / 3 / 4; background-color: peachpuff; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; margin: auto;">
        <img id="die1" class="die" src="cards.gif">
        <img id="die2" class="die" src="cards.gif">
        <img id="die3" class="die" src="cards.gif">
        <img id="die4" class="die" src="cards.gif">
        <img id="die5" class="die" src="cards.gif">
        
        <span class="container"><input type="checkbox" id="dieHold1" class="hidden"></input><label for="dieHold1" class="hold">Hold</label></span>
        <span class="container"><input type="checkbox" id="dieHold2" class="hidden"></input><label for="dieHold2" class="hold">Hold</label></span>
        <span class="container"><input type="checkbox" id="dieHold3" class="hidden"></input><label for="dieHold3" class="hold">Hold</label></span>
        <span class="container"><input type="checkbox" id="dieHold4" class="hidden"></input><label for="dieHold4" class="hold">Hold</label></span>
        <span class="container"><input type="checkbox" id="dieHold5" class="hidden"></input><label for="dieHold5" class="hold">Hold</label></span>
        
        <div style="grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; place-items: center; margin-top: 8px; row-gap: 8px;">
          <fieldset>
            <legend>Values</legend>
            <ol>
              <li>Snail &ndash; 1</li>
              <li>Shroom &ndash; 2</li>
              <li>Pig &ndash; 3</li>
              <li>Root &ndash; 4</li>
              <li>Panda &ndash; 5</li>
              <li>Mano &ndash; 6</li>
            </ol>
          </fieldset>
          <div style="position: relative;">
            <span id="scoreLabel">Score 0</span>
          </div>
          <fieldset>
            <legend>Game Data</legend>
            <ul>
              <li id="rollCountLabel" style="margin-block: 8px;">Rolls Made: 0</li>
              <li id="subTotalLabel" style="margin-block: 8px;">Sub Total: 0</li>
              <li id="yahtzeeCountLabel" style="margin-block: 8px;">Yahtzees: 0</li>
            </ul>
          </fieldset>
          
          <button id="quitButton" class="action" style="justify-self: start;">Quit</button>
          <button id="rollButton" class="action">Roll</button>
          <button id="resetButton" class="action" style="justify-self: end;">Reset Game</button>
        </div>
      </div>
    </div>
    <button class="zoom" title="Mini Mode">🔍</button>
  </div>
  <script type="module" src="yahtzee.js"></script>
</body>
</html>
